<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>01 — 표지</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="card">
      <!-- Top bar -->
      <div class="top-bar">
        <span class="top-bar-company">NEW EMPLOYEE</span>
        <div class="top-bar-divider"></div>
        <span class="top-bar-category">ONBOARDING GUIDE</span>
      </div>

      <!-- Body -->
      <div class="card-body">
        <div class="cover-inner">
          <!-- Left: text -->
          <div class="cover-left">
            <p class="cover-pretitle">신규 입사자의 빠른 적응을 위한</p>
            <h1 class="cover-main-title">신입사원<br>온보딩<br>가이드</h1>
          </div>

          <!-- Right: ID card illustration -->
          <div class="id-card-wrap">
            <div class="lanyard-clip"></div>
            <div class="lanyard"></div>
            <div class="id-card">
              <!-- Welcome bubble -->
              <div class="welcome-bubble">WELCOME</div>

              <div class="id-photo">
                <!-- Person silhouette SVG -->
                <svg viewBox="0 0 90 100" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="45" cy="30" r="22" fill="#777"/>
                  <ellipse cx="45" cy="90" rx="36" ry="28" fill="#777"/>
                </svg>
              </div>
              <div class="id-name-bar"></div>
              <div class="id-lines">
                <div class="id-line id-line--gray"></div>
                <div class="id-line id-line--gray2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <div class="footer-logo">MRI COMPANY</div>
        <div class="footer-date">2080년 1월 | 4화점</div>
      </div>
    </div>
  </div>
</body>
</html>
