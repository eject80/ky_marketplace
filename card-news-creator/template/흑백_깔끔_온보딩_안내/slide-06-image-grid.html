<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>06 — 회사 공간 안내</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="card">
      <!-- Top bar -->
      <div class="top-bar">
        <span class="top-bar-company">회사 시설</span>
      </div>

      <!-- Body -->
      <div class="card-body">
        <p class="section-pre">미리컴퍼니</p>
        <h1 class="page-title">회사 공간 안내</h1>
        <p class="intro-text">매일 마주칠 오피스는 효율적인 업무와 편안한 휴식을 위한<br>공간들로 구성되어 있습니다.</p>

        <!-- Main image (메인 오피스) -->
        <div class="main-img">
          <span class="main-img-label">미리컴퍼니 오피스</span>
        </div>

        <!-- 2x2 sub grid -->
        <div class="sub-grid">
          <div class="sub-img-item">
            <div class="sub-img sub-img--1">
              <span class="sub-img-label">1인 집중 부스</span>
            </div>
          </div>
          <div class="sub-img-item">
            <div class="sub-img sub-img--2">
              <span class="sub-img-label">업무 집중 공간</span>
            </div>
          </div>
          <div class="sub-img-item">
            <div class="sub-img sub-img--3">
              <span class="sub-img-label">직원 휴게 공간</span>
            </div>
          </div>
          <div class="sub-img-item">
            <div class="sub-img sub-img--4">
              <span class="sub-img-label">화상회의 공간</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <div class="footer-logo">MRI COMPANY</div>
        <div class="footer-date">2080년 1월 | 4화점</div>
      </div>
    </div>
  </div>
</body>
</html>
