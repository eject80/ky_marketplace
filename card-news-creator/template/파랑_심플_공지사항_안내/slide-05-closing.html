<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>05 — 마무리/CTA (Closing)</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="cal-wrap">
      <div class="cal-header">APRIL NEWSLETTER</div>
      <div class="cal-rings">
        <div class="cal-ring"></div>
        <div class="cal-ring"></div>
      </div>
      <div class="cal-board">

        <!-- 번호 + 제목 -->
        <div class="title-group">
          <div class="slide-num-badge">04</div>
          <h1 class="page-title" style="font-size:72px; text-align:center; line-height:1.2;">함께 만들어가는<br>우리 회사</h1>
        </div>

        <!-- 아이콘 + 박스들 -->
        <div class="icon-box-row">
          <!-- 메가폰 아이콘 -->
          <div class="icon-col">
            <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="26" cy="50" rx="14" ry="18" fill="#c0c0c0"/>
              <polygon points="40,35 88,16 88,84 40,65" fill="#d0d0d0"/>
              <rect x="12" y="43" width="28" height="14" rx="4" fill="#c8c8c8"/>
              <rect x="84" y="16" width="14" height="68" rx="7" fill="#2c76f0"/>
            </svg>
          </div>

          <!-- key-message 박스들 -->
          <div class="key-boxes">
            <div class="key-box">
              <p class="key-box-label">다음 달 일정 예고</p>
              <p class="key-box-content">봄맞이 대청소 및 회식</p>
            </div>
            <div class="key-box">
              <p class="key-box-label">제보/소식 공유 유도</p>
              <p class="key-box-content">
                회사홍보에 도움이 되는 아이디어<br>
                제공시 소정의 상품권을 제공해드립니다.
              </p>
            </div>
          </div>
        </div>

        <!-- 구분선 -->
        <hr class="closing-divider">

        <!-- 문의 -->
        <p class="closing-contact">문의 : @miricompany</p>

        <!-- 장식: 우측 하단 돋보기 + 꽃 SVG -->
        <div class="deco-bottom-right">
          <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- 꽃잎들 -->
            <ellipse cx="90" cy="28" rx="8" ry="16" fill="#f87" opacity="0.7" transform="rotate(0 90 44)"/>
            <ellipse cx="100" cy="40" rx="8" ry="16" fill="#fa9" opacity="0.7" transform="rotate(30 100 56)"/>
            <!-- 잎 -->
            <path d="M80 60 Q60 40 50 55 Q65 65 80 60Z" fill="#7c4" opacity="0.8"/>
            <path d="M82 65 Q58 60 55 75 Q70 75 82 65Z" fill="#6b3" opacity="0.8"/>
            <!-- 파일/폴더 -->
            <rect x="55" y="55" width="60" height="74" rx="8" fill="#f8c300" opacity="0.9"/>
            <rect x="55" y="48" width="32" height="16" rx="6" fill="#f8c300"/>
            <!-- 종이 -->
            <rect x="63" y="68" width="44" height="8" rx="3" fill="#fff" opacity="0.6"/>
            <rect x="63" y="82" width="36" height="8" rx="3" fill="#fff" opacity="0.6"/>
            <rect x="63" y="96" width="28" height="8" rx="3" fill="#fff" opacity="0.6"/>
            <!-- 돋보기 -->
            <circle cx="48" cy="110" r="30" stroke="#666" stroke-width="7" fill="rgba(200,210,230,0.35)"/>
            <line x1="70" y1="132" x2="98" y2="158" stroke="#555" stroke-width="9" stroke-linecap="round"/>
          </svg>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
