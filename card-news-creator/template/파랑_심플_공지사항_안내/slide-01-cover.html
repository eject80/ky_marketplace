<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>01 — 표지 (Cover)</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="cal-wrap">
      <!-- 상단 헤더 -->
      <div class="cal-header">APRIL NEWSLETTER</div>

      <!-- 링 핀 -->
      <div class="cal-rings">
        <div class="cal-ring"></div>
        <div class="cal-ring"></div>
      </div>

      <!-- 메인 보드 -->
      <div class="cal-board">
        <!-- 별 장식 -->
        <div class="cover-stars">
          <span class="star">✦</span>
          <span class="star" style="font-size:72px; margin-top:-10px;">✦</span>
          <span class="star">✦</span>
        </div>

        <!-- 말풍선 타이틀 -->
        <div class="cover-bubble-group">
          <div class="bubble-dark">
            <span class="bubble-dark-text">이번 달</span>
          </div>
          <div class="bubble-blue">
            <span class="bubble-blue-text">공지사항</span>
          </div>
        </div>

        <!-- 부제 -->
        <p class="cover-sub">이 달의 주요한 소식과 공지사항을<br>전달해 드리는 뉴스레터입니다.</p>

        <!-- 장식 SVG: 메가폰 -->
        <div class="deco-icon deco-megaphone">
          <svg width="110" height="110" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="30" cy="55" rx="16" ry="20" fill="#bbb"/>
            <polygon points="46,38 90,18 90,92 46,72" fill="#ccc"/>
            <rect x="14" y="48" width="32" height="14" rx="4" fill="#ddd"/>
            <!-- 파란 메가폰 끝 -->
            <rect x="86" y="18" width="16" height="74" rx="8" fill="#2c76f0"/>
          </svg>
        </div>

        <!-- 장식 SVG: 스마트폰 -->
        <div class="deco-icon deco-phone">
          <svg width="90" height="100" viewBox="0 0 90 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="5" width="70" height="90" rx="14" fill="#3a3a3a" stroke="#555" stroke-width="3"/>
            <rect x="18" y="18" width="54" height="60" rx="6" fill="#f0f4ff"/>
            <circle cx="45" cy="87" r="5" fill="#666"/>
            <!-- i 아이콘 -->
            <circle cx="45" cy="38" r="10" fill="#2c76f0"/>
            <text x="45" y="43" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="sans-serif">i</text>
          </svg>
        </div>

        <!-- 장식 SVG: 돋보기 -->
        <div class="deco-icon deco-magnify">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="48" cy="48" r="34" stroke="#555" stroke-width="8" fill="rgba(200,210,230,0.5)"/>
            <line x1="74" y1="74" x2="108" y2="108" stroke="#444" stroke-width="10" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- 장식: 반짝이 -->
        <div class="deco-icon deco-sparkle">✸</div>
      </div>
    </div>
  </div>
</body>
</html>
