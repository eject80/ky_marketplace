<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>표지 — 편집이 쉬운 카드뉴스</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <!-- Stacked page effect -->
    <div class="page-stack">
      <div class="page-stack-layer page-stack-layer--1"></div>
      <div class="page-stack-layer page-stack-layer--2"></div>
    </div>

    <div class="main-card">
      <!-- Bookmark tab -->
      <div class="bookmark-tab">
        <div class="bookmark-blue"></div>
        <div class="bookmark-gray"></div>
      </div>

      <!-- Badge -->
      <div class="cover-badge">Easy-to-edit presentations</div>

      <!-- Main title -->
      <div class="cover-title">
        <span class="t-blue">편집이</span> <span class="t-orange">쉬운</span><br>
        <span class="t-black">카드뉴스</span>
      </div>

      <!-- Sub text -->
      <p class="cover-sub">
        다양한 레이아웃으로<br>
        쉽게 활용할 수 있는 카드뉴스
      </p>

      <!-- Character group (CSS illustration) -->
      <div class="char-group">
        <div class="char char--big"></div>
        <div class="char char--small"></div>
      </div>
    </div>
  </div>
</body>
</html>
