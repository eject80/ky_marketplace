<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>표 정리 페이지</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="page-stack">
      <div class="page-stack-layer page-stack-layer--1"></div>
      <div class="page-stack-layer page-stack-layer--2"></div>
    </div>

    <div class="main-card">
      <div class="bookmark-tab">
        <div class="bookmark-blue"></div>
        <div class="bookmark-gray"></div>
      </div>

      <!-- Page title -->
      <div class="page-title-row">
        <span class="page-title"><span class="t-blue">표</span>로 정리하는 페이지</span>
      </div>
      <hr class="divider-line">

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th></th>
              <th>A</th>
              <th>B</th>
              <th>C</th>
              <th>D</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>텍스트</td>
              <td>텍스트</td>
              <td>텍스트</td>
              <td>텍스트</td>
            </tr>
            <tr>
              <td>2</td>
              <td>텍스트</td>
              <td>텍스트</td>
              <td>텍스트</td>
              <td>텍스트</td>
            </tr>
            <tr>
              <td>3</td>
              <td>텍스트</td>
              <td>텍스트</td>
              <td>텍스트</td>
              <td>텍스트</td>
            </tr>
          </tbody>
        </table>

        <p class="table-desc">
          주요 항목을 한눈에 확인할 수 있도록 핵심 정보를 정리했습니다.<br>
          각 항목별 특징과 간단한 설명을 함께 제공합니다.<br>
          필요한 내용을 빠르게 비교하고 이해할 수 있습니다.<br>
          상황에 맞는 정보를 선택해 활용해 보세요.
        </p>
      </div>

      <div class="char-blob"></div>
      <div class="char-heart"></div>
    </div>
  </div>
</body>
</html>
