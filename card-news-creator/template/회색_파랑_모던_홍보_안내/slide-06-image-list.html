<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>사진을 활용하는 페이지</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="page-stack">
      <div class="page-stack-layer page-stack-layer--1"></div>
      <div class="page-stack-layer page-stack-layer--2"></div>
    </div>

    <div class="main-card">
      <div class="bookmark-tab">
        <div class="bookmark-blue"></div>
        <div class="bookmark-gray"></div>
      </div>

      <!-- Camera deco (SVG) -->
      <div class="deco-camera">
        <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" width="72" height="72">
          <rect x="8" y="22" width="56" height="40" rx="8" fill="#e8e8e8" stroke="#bbb" stroke-width="3"/>
          <circle cx="36" cy="42" r="14" fill="none" stroke="#bbb" stroke-width="3"/>
          <circle cx="36" cy="42" r="8" fill="#d0d0d0"/>
          <rect x="22" y="14" width="20" height="12" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="2.5"/>
          <circle cx="55" cy="32" r="4" fill="#f0a030"/>
        </svg>
      </div>

      <!-- Page title -->
      <div class="page-title-row">
        <span class="page-title"><span class="t-blue">사진</span>을 활용하는 페이지</span>
      </div>
      <hr class="divider-line">

      <!-- Image list -->
      <div class="img-list">
        <div class="img-list-row">
          <div class="img-placeholder"></div>
          <div class="img-list-text">
            <div class="img-list-title">첫 번째</div>
            <div class="img-list-desc">사진에 대한 내용을 간결하게 적어주세요.<br>2~3줄로 적으면 쉽게 읽을 수 있어요</div>
          </div>
        </div>
        <div class="img-list-row">
          <div class="img-placeholder"></div>
          <div class="img-list-text">
            <div class="img-list-title">두 번째</div>
            <div class="img-list-desc">사진에 대한 내용을 간결하게 적어주세요.<br>2~3줄로 적으면 쉽게 읽을 수 있어요</div>
          </div>
        </div>
        <div class="img-list-row">
          <div class="img-placeholder"></div>
          <div class="img-list-text">
            <div class="img-list-title">세 번째</div>
            <div class="img-list-desc">사진에 대한 내용을 간결하게 적어주세요.<br>2~3줄로 적으면 쉽게 읽을 수 있어요</div>
          </div>
        </div>
      </div>

      <!-- Film deco -->
      <div class="deco-film"></div>
    </div>
  </div>
</body>
</html>
