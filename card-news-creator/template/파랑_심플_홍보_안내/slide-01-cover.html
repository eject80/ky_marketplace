<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>01 표지</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="board-wrap">
      <!-- Black clip SVG -->
      <div class="clip-top">
        <svg viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg" width="280" height="90">
          <defs>
            <linearGradient id="clipGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#555555"/>
              <stop offset="100%" stop-color="#1a1a1a"/>
            </linearGradient>
          </defs>
          <!-- Outer rectangular body -->
          <rect x="4" y="48" width="272" height="38" rx="10" fill="url(#clipGrad)"/>
          <!-- Arch -->
          <path d="M90 48 C90 6 190 6 190 48" fill="none" stroke="url(#clipGrad)" stroke-width="24" stroke-linecap="round"/>
          <!-- Highlight strip -->
          <rect x="4" y="48" width="272" height="14" rx="10" fill="rgba(255,255,255,0.12)"/>
          <!-- Shadow line -->
          <line x1="4" y1="66" x2="276" y2="66" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
        </svg>
      </div>

      <!-- White clipboard board -->
      <div class="clipboard-board">
        <!-- Cover content: centered -->
        <div class="cover-body">
          <!-- Chat bubble icon -->
          <svg class="chat-icon" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
            <!-- Back bubble -->
            <ellipse cx="62" cy="56" rx="34" ry="28" fill="none" stroke="#1a1a1a" stroke-width="5"/>
            <path d="M62 84 Q64 92 58 96 Q54 92 56 84" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
            <!-- Front bubble -->
            <ellipse cx="44" cy="46" rx="34" ry="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="5"/>
            <path d="M44 74 Q42 82 36 86 Q40 82 42 74" fill="#ffffff" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
            <!-- Dots inside front bubble -->
            <circle cx="33" cy="46" r="4" fill="#1a1a1a"/>
            <circle cx="44" cy="46" r="4" fill="#1a1a1a"/>
            <circle cx="55" cy="46" r="4" fill="#1a1a1a"/>
          </svg>

          <!-- Title -->
          <div class="cover-title">
            <span class="line1"><span class="h-blue">간단</span><span class="h-black">하고</span></span>
            <span class="line2"><span class="h-blue">깔끔</span><span class="h-black">한</span></span>
            <span class="line3">카드뉴스</span>
          </div>

          <!-- Subtitle -->
          <p class="cover-subtitle">Simple and clean presentation</p>
        </div>

        <!-- Footer bar -->
        <div class="cover-footer">
          <span class="cover-url">sample.sample.com</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
