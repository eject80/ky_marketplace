<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>긴 글이 있는 페이지</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="board-wrap">
      <div class="board-shadow board-shadow--1"></div>
      <div class="board-shadow board-shadow--2"></div>
      <div class="clipboard-board">
        <div class="clip-top">
          <svg viewBox="0 0 200 88" xmlns="http://www.w3.org/2000/svg" width="200" height="88">
            <defs>
              <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#d6d6d6"/>
                <stop offset="100%" stop-color="#a0a0a0"/>
              </linearGradient>
            </defs>
            <path d="M66 52 C66 10 134 10 134 52" fill="none" stroke="url(#cg)" stroke-width="24" stroke-linecap="round"/>
            <rect x="10" y="52" width="180" height="32" rx="10" fill="url(#cg)"/>
            <rect x="10" y="52" width="180" height="11" rx="10" fill="rgba(255,255,255,0.28)"/>
            <line x1="12" y1="72" x2="188" y2="72" stroke="rgba(0,0,0,0.11)" stroke-width="2"/>
            <path d="M74 52 C74 22 126 22 126 52" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="10" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card">
          <div class="chapter-badge">
            <span class="chapter-num">01</span>
            <span class="chapter-label">CHAPTER</span>
          </div>
          <h2 class="page-title">긴 글이 있는 페이지</h2>
          <div class="img-placeholder img-wide">
            <span class="img-placeholder-label">이미지를 입력해주세요</span>
          </div>
          <div class="search-row">
            <div class="icon-search">
              <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="15" cy="15" r="9" stroke="#3d6e8f" stroke-width="2.8"/>
                <line x1="22" y1="22" x2="31" y2="31" stroke="#3d6e8f" stroke-width="2.8" stroke-linecap="round"/>
                <line x1="11" y1="15" x2="19" y2="15" stroke="#3d6e8f" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="15" y1="11" x2="15" y2="19" stroke="#3d6e8f" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="section-subtitle">소제목 또는 키워드를 입력해주세요.</p>
          </div>
          <p class="body-text">
            해당 페이지는 많은 분량 텍스트를 입력할 때 쓰기 좋은 페이지입니다. 중요한 내용이나 길게 연결을 보여주어야 할 경우 페이지를 활용해보세요. 전체적인 맥락 패턴과 함께 폰트와 색상 등을 활용해주세요. 이미지에 대한 설명을 입력해주세요.
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
