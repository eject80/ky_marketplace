<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>슬라이드 02 — 안내 카드</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <!-- Header -->
    <div class="header-band">
      <div class="brand-logo">canvas</div>
      <h1 class="header-title">4가지 개별 안내 페이지</h1>
      <p class="header-subtitle">부제를 입력하세요.</p>
      <!-- Megaphone icon placeholder -->
      <div class="header-icon">
        <svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="90" cy="90" rx="78" ry="78" fill="rgba(255,255,255,0.08)"/>
          <!-- megaphone body -->
          <path d="M40 72 L110 44 L110 116 L40 88 Z" rx="6" fill="#b0c4de" stroke="#88a8c8" stroke-width="3"/>
          <!-- bell -->
          <rect x="24" y="72" width="18" height="18" rx="4" fill="#90aacc"/>
          <!-- handle -->
          <path d="M42 90 Q42 112 54 112 Q66 112 66 90" stroke="#7090b8" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- sound waves -->
          <path d="M118 68 Q134 80 134 90 Q134 100 118 112" stroke="rgba(255,255,255,0.5)" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M122 56 Q148 72 148 90 Q148 108 122 124" stroke="rgba(255,255,255,0.3)" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Info cards list -->
    <div class="body-area">
      <div class="info-card">
        <div class="info-card-title">일시 및 장소</div>
        <div class="info-card-body">2099년 12월 31일(목) 미리호텔 3층 미리홀</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">주요 활동</div>
        <div class="info-card-body">미리세미나 _ 미리시 내 민원 해결 모임</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">주차 및 안내</div>
        <div class="info-card-body">1층, 지하 1층에 안내요원 배치. 3시간 무료 주차</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">문의처</div>
        <div class="info-card-body">미리시 민원해결과 099) 123-4567</div>
      </div>
    </div>
  </div>
</body>
</html>
