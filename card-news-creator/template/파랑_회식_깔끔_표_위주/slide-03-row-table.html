<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>슬라이드 03 — 행 위주 표</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <!-- Header -->
    <div class="header-band">
      <div class="brand-logo">canvas</div>
      <h1 class="header-title">행 위주 정리 페이지</h1>
      <p class="header-subtitle">부제를 입력하세요.</p>
      <!-- Folder with magnifier icon placeholder -->
      <div class="header-icon">
        <svg viewBox="0 0 170 170" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- folder body -->
          <path d="M14 50 Q14 38 26 38 L60 38 L70 52 L144 52 Q156 52 156 64 L156 132 Q156 144 144 144 L26 144 Q14 144 14 132 Z" fill="#f5c842"/>
          <path d="M14 64 L156 64 L156 132 Q156 144 144 144 L26 144 Q14 144 14 132 Z" fill="#f7d454"/>
          <!-- document lines -->
          <rect x="52" y="80" width="48" height="6" rx="3" fill="#3ecfbe" opacity="0.85"/>
          <rect x="52" y="94" width="36" height="6" rx="3" fill="#3ecfbe" opacity="0.65"/>
          <!-- magnifier -->
          <circle cx="122" cy="118" r="22" stroke="#e8e8ea" stroke-width="6" fill="none"/>
          <circle cx="122" cy="118" r="14" fill="rgba(255,255,255,0.25)"/>
          <line x1="138" y1="132" x2="152" y2="148" stroke="#e8e8ea" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Body with table card -->
    <div class="body-area">
      <div class="content-card">
        <div class="table-intro-title">참여자 명단 확인 후 신청바랍니다.</div>
        <div class="table-intro-sub">본인 이름 및 핸드폰 뒷번호를 확인해주세요.</div>

        <table class="data-table">
          <thead>
            <tr>
              <th>이름</th>
              <th>소속</th>
              <th>행사장</th>
              <th>뒷번호</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>김미리</td><td>미리상사</td><td>3층 미리홀</td><td>1234</td></tr>
            <tr><td>박미리</td><td>미리전자</td><td>3층 미리홀</td><td>2345</td></tr>
            <tr><td>정미리</td><td>미리차</td><td>3층 미리홀</td><td>5432</td></tr>
            <tr><td>최미리</td><td>미리전자</td><td>2층 나비홀</td><td>9876</td></tr>
            <tr><td>현미리</td><td>미리반도체</td><td>2층 나비홀</td><td>5678</td></tr>
            <tr><td>이미리</td><td>디자인 미리</td><td>3층 미리홀</td><td>6789</td></tr>
            <tr><td>서미리</td><td>(주)미리공업</td><td>2층 나비홀</td><td>1234</td></tr>
            <tr><td>신미리</td><td>미리유통</td><td>3층 미리홀</td><td>2345</td></tr>
            <tr><td>유미리</td><td>미리와함께</td><td>2층 나비홀</td><td>3456</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
