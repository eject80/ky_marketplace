<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>03 — 미션과 비전</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="card">
      <!-- Top bar -->
      <div class="top-bar">
        <span class="top-bar-company">회사 이해 하기</span>
      </div>

      <!-- Body -->
      <div class="card-body">
        <p class="section-pre">미리컴퍼니</p>
        <h1 class="page-title">미션과 비전</h1>

        <p class="desc-text">우리는 반복적인 업무를 줄이는 솔루션을 통해, 빠른 성장해냄으로써<br>협업으로 더 나은 업무 환경을 여러분과 함께 만들어가려고 합니다.</p>

        <div class="mv-row">
          <div class="mv-box">
            <span class="mv-label">MISSION</span>
            <p class="mv-text">기업의 반복 업무를 제거하고, 사람들이<br>창의적 업무에 집중할 수 있도록 돕습니다.</p>
          </div>
          <div class="mv-box">
            <span class="mv-label">VISION</span>
            <p class="mv-text">회사가 성장구역으로도 도달하고자 하는<br>목표를 구체적으로 작성해 보세요.</p>
          </div>
        </div>

        <div class="core-section">
          <div class="core-label-wrap">
            <span class="core-label">CORE VALUE</span>
          </div>
          <div class="core-pills">
            <div class="core-pill">고객 중심</div>
            <div class="core-pill">도전과 실험</div>
            <div class="core-pill">투명한 소통</div>
            <div class="core-pill">전문성 추구</div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <div class="footer-logo">MRI COMPANY</div>
        <div class="footer-date">2080년 1월 | 4화점</div>
      </div>
    </div>
  </div>
</body>
</html>
