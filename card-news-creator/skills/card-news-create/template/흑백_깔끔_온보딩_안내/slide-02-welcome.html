<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>02 — 환영 메시지</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="card" style="position:relative;">
      <!-- Top bar -->
      <div class="top-bar">
        <span class="top-bar-company">온보딩을 시작하며</span>
      </div>

      <!-- Body -->
      <div class="card-body">
        <!-- Floating chat bubbles -->
        <div class="hello-bubble">HELLO.</div>
        <div class="welcome-bubble">WELCOME.</div>

        <p class="welcome-pre">미리컴퍼니</p>
        <h1 class="welcome-title">미리컴퍼니<br><span class="line2">입사를 환영합니다!</span></h1>

        <hr class="section-divider">

        <!-- Item list -->
        <div class="item-list">
          <!-- Item 1: 회사 이해 -->
          <div class="item-row">
            <div class="item-icon">
              <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="17" cy="13" r="7" stroke="#1a1a1a" stroke-width="2.5"/>
                <path d="M5 29c0-6.627 5.373-10 12-10s12 3.373 12 10" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="item-text-wrap">
              <div class="item-title">회사 이해</div>
              <div class="item-desc">추구하는 비전과 가치, 사업 방향에 깊이 이해해 깊은 목표를<br>향해 나아갈 수 있습니다.</div>
            </div>
          </div>

          <!-- Item 2: 업무 숙지 -->
          <div class="item-row">
            <div class="item-icon">
              <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="4" width="24" height="28" rx="3" stroke="#1a1a1a" stroke-width="2.5"/>
                <line x1="10" y1="13" x2="24" y2="13" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="10" y1="19" x2="24" y2="19" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="10" y1="25" x2="19" y2="25" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="item-text-wrap">
              <div class="item-title">업무 숙지</div>
              <div class="item-desc">업무에 필요한 시스템, 규칙, 프로세스를 정확히 따라갈 효율적으로<br>일할 수 있습니다.</div>
            </div>
          </div>

          <!-- Item 3: 조직 적응 -->
          <div class="item-row">
            <div class="item-icon">
              <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="14" r="5.5" stroke="#1a1a1a" stroke-width="2.5"/>
                <circle cx="23" cy="14" r="5.5" stroke="#1a1a1a" stroke-width="2.5"/>
                <path d="M3 29c0-5 3.6-8 8-8" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M31 29c0-5-3.6-8-8-8" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M14 22c0 0 1.5-1 3 0" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="item-text-wrap">
              <div class="item-title">조직 적응</div>
              <div class="item-desc">동료들과 원활하게 소통하는 문화를 익혀, 팀의 일원으로서 빠르게<br>기여할 수 있습니다.</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <div class="footer-logo">MRI COMPANY</div>
        <div class="footer-date">2080년 1월 | 4화점</div>
      </div>
    </div>
  </div>
</body>
</html>
