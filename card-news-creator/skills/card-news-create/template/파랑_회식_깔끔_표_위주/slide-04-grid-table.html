<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>슬라이드 04 — 그리드 표</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <!-- Header -->
    <div class="header-band">
      <div class="brand-logo">canvas</div>
      <h1 class="header-title">개별 표 정리 페이지</h1>
      <p class="header-subtitle">부제를 입력하세요.</p>
      <!-- Checkbox icon placeholder -->
      <div class="header-icon">
        <svg viewBox="0 0 155 155" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- outer square -->
          <rect x="12" y="12" width="131" height="131" rx="26" fill="#3355cc"/>
          <!-- inner highlight -->
          <rect x="12" y="12" width="131" height="60" rx="26" fill="rgba(255,255,255,0.12)"/>
          <!-- checkmark -->
          <path d="M34 80 L62 108 L122 48" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- Body with schedule grid -->
    <div class="body-area">
      <div class="content-card">
        <p class="grid-intro-text">각 프로그램 일정을 확인하시기 바랍니다.</p>

        <div class="schedule-grid">
          <!-- Row 1 -->
          <div class="schedule-cell">
            <div class="schedule-cell-header">9~11시</div>
            <div class="schedule-cell-body">
              <div class="schedule-venue">2층 나비홀</div>
              <hr class="schedule-divider">
              <div class="schedule-prog">프로그램명을<br>적으세요</div>
            </div>
          </div>

          <div class="schedule-cell">
            <div class="schedule-cell-header">11~13시</div>
            <div class="schedule-cell-body">
              <div class="schedule-venue">2층 나비홀</div>
              <hr class="schedule-divider">
              <div class="schedule-prog">프로그램명을<br>적으세요</div>
            </div>
          </div>

          <div class="schedule-cell">
            <div class="schedule-cell-header">13~14시</div>
            <div class="schedule-cell-body">
              <div class="schedule-venue">2층 나비홀</div>
              <hr class="schedule-divider">
              <div class="schedule-prog">프로그램명을<br>적으세요</div>
            </div>
          </div>

          <!-- Row 2 -->
          <div class="schedule-cell">
            <div class="schedule-cell-header">14~15시</div>
            <div class="schedule-cell-body">
              <div class="schedule-venue">2층 나비홀</div>
              <hr class="schedule-divider">
              <div class="schedule-prog">프로그램명을<br>적으세요</div>
            </div>
          </div>

          <div class="schedule-cell">
            <div class="schedule-cell-header">15~16시</div>
            <div class="schedule-cell-body">
              <div class="schedule-venue">2층 나비홀</div>
              <hr class="schedule-divider">
              <div class="schedule-prog">프로그램명을<br>적으세요</div>
            </div>
          </div>

          <div class="schedule-cell">
            <div class="schedule-cell-header">16~17시</div>
            <div class="schedule-cell-body">
              <div class="schedule-venue">2층 나비홀</div>
              <hr class="schedule-divider">
              <div class="schedule-prog">프로그램명을<br>적으세요</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
