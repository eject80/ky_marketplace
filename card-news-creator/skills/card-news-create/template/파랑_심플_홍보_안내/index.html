<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파랑 심플 홍보 안내 — 슬라이드 목록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">파랑 심플 홍보 안내</h1>
    <p class="page-meta">슬라이드 클릭 → 새 탭에서 전체 크기(1080 × 1440 px) 미리보기</p>
  </div>

  <div class="slides-grid" id="slidesGrid"></div>

  <script>
    const slides = [
      { num: '01', name: '표지',          file: 'slide-01-cover.html' },
      { num: '02', name: '목차',          file: 'slide-02-toc.html' },
      { num: '03', name: '핵심 메시지',   file: 'slide-03-key-message.html' },
      { num: '04', name: '이미지 설명',   file: 'slide-04-image.html' },
      { num: '05', name: '비교 정리',     file: 'slide-05-comparison.html' },
      { num: '06', name: '포인트 정리',   file: 'slide-06-points.html' },
      { num: '07', name: '표 레이아웃',   file: 'slide-07-table.html' },
      { num: '08', name: '3개의 이미지',  file: 'slide-08-image-grid.html' },
      { num: '09', name: '아이콘 정리',   file: 'slide-09-steps.html' },
    ];

    function render() {
      const grid = document.getElementById('slidesGrid');
      const colWidth = (grid.clientWidth - 48) / 3;  /* gap 24px × 2 = 48 */
      const previewH = colWidth * (1440 / 1080);
      const scale = colWidth / 1080;

      grid.innerHTML = slides.map(s => `
        <div class="slide-card">
          <div class="slide-meta">
            <span class="slide-num">${s.num}</span>
            <span class="slide-name">${s.name}</span>
          </div>
          <div class="slide-preview" style="height:${previewH}px">
            <iframe
              src="${s.file}"
              width="1080"
              height="1440"
              scrolling="no"
              style="transform:scale(${scale.toFixed(4)});"
            ></iframe>
            <a class="slide-link" href="${s.file}" target="_blank" title="${s.name} 전체 보기"></a>
          </div>
        </div>
      `).join('');
    }

    render();
    window.addEventListener('resize', render);
  </script>
</body>
</html>
