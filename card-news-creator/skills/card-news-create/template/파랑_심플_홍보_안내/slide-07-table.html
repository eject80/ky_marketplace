<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>07 표 레이아웃</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="board-wrap">
      <!-- Clip -->
      <div class="clip-top">
        <svg viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg" width="280" height="90">
          <defs>
            <linearGradient id="clipGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#555555"/>
              <stop offset="100%" stop-color="#1a1a1a"/>
            </linearGradient>
          </defs>
          <rect x="4" y="48" width="272" height="38" rx="10" fill="url(#clipGrad)"/>
          <path d="M90 48 C90 6 190 6 190 48" fill="none" stroke="url(#clipGrad)" stroke-width="24" stroke-linecap="round"/>
          <rect x="4" y="48" width="272" height="14" rx="10" fill="rgba(255,255,255,0.12)"/>
          <line x1="4" y1="66" x2="276" y2="66" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
        </svg>
      </div>

      <div class="clipboard-board">
        <div class="card">
          <!-- Title -->
          <div class="title-row">
            <span class="page-title-ko"><span class="h-blue">표</span> 레이아웃</span>
            <span class="page-en">Table Layout</span>
          </div>
          <hr class="title-rule">

          <!-- Subtitle -->
          <p class="table-subtitle">이곳에 내용을 입력해주세요</p>

          <!-- Table -->
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>항목/구분</th>
                  <th>내용</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>키워드</td>
                  <td>내용을 입력해주세요</td>
                </tr>
                <tr>
                  <td>키워드</td>
                  <td>내용을 입력해주세요</td>
                </tr>
                <tr>
                  <td>키워드</td>
                  <td>내용을 입력해주세요</td>
                </tr>
                <tr>
                  <td>키워드</td>
                  <td>내용을 입력해주세요</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Body text -->
          <p class="body-text">이 페이지에는 일정, 비교 정보, 결과 정리 등을 표 형태로 작성하면 좋<br>습니다. 비즈니스 보고서나 학교 발표에서 정보 전달용으로 활용하기<br>좋습니다.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
