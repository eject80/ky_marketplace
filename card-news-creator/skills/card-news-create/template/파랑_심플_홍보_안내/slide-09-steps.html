<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>09 아이콘 정리</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="board-wrap">
      <!-- Clip -->
      <div class="clip-top">
        <svg viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg" width="280" height="90">
          <defs>
            <linearGradient id="clipGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#555555"/>
              <stop offset="100%" stop-color="#1a1a1a"/>
            </linearGradient>
          </defs>
          <rect x="4" y="48" width="272" height="38" rx="10" fill="url(#clipGrad)"/>
          <path d="M90 48 C90 6 190 6 190 48" fill="none" stroke="url(#clipGrad)" stroke-width="24" stroke-linecap="round"/>
          <rect x="4" y="48" width="272" height="14" rx="10" fill="rgba(255,255,255,0.12)"/>
          <line x1="4" y1="66" x2="276" y2="66" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
        </svg>
      </div>

      <div class="clipboard-board">
        <div class="card">
          <!-- Title -->
          <div class="title-row">
            <span class="page-title-ko"><span class="h-blue">아이콘</span> 정리</span>
            <span class="page-en">Icon Layout</span>
          </div>
          <hr class="title-rule">

          <!-- Steps -->
          <ul class="steps-list">
            <!-- STEP 01 -->
            <li>
              <div class="step-row">
                <!-- Handshake icon -->
                <div class="step-icon-circle">
                  <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none">
                    <path d="M8 34 Q10 26 18 24 L26 22 L32 28 L38 24 Q46 22 52 30" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8 34 L16 42 Q20 46 26 44 L38 36" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M38 36 L44 40 Q48 42 50 38 L52 30" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M32 28 L38 36" stroke="white" stroke-width="3" stroke-linecap="round"/>
                  </svg>
                </div>
                <div class="step-content">
                  <div class="step-badge">
                    <span class="step-badge-label">STEP</span>
                    <span class="step-badge-num">01</span>
                  </div>
                  <p class="step-desc">첫 번째 단계에서는 전체 진행의 시작이 되는 기본 내용을 설명합니다. <span class="step-highlight">가장 기초가 되는 내용을 정리하면 좋습니다.</span></p>
                </div>
              </div>
            </li>

            <!-- Down arrow -->
            <div class="step-arrow-wrap">
              <svg viewBox="0 0 32 38" xmlns="http://www.w3.org/2000/svg" fill="none">
                <path d="M16 2 L16 30 M6 22 L16 34 L26 22" stroke="#555555" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <!-- STEP 02 -->
            <li>
              <div class="step-row">
                <!-- Light bulb icon -->
                <div class="step-icon-circle">
                  <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none">
                    <circle cx="30" cy="24" r="12" stroke="white" stroke-width="3"/>
                    <path d="M24 36 Q22 42 26 44 H34 Q38 42 36 36" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    <line x1="26" y1="46" x2="34" y2="46" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    <line x1="30" y1="8" x2="30" y2="4" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="14" y1="24" x2="10" y2="24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="46" y1="24" x2="50" y2="24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="18.5" y1="12.5" x2="15.7" y2="9.7" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="41.5" y1="12.5" x2="44.3" y2="9.7" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                  </svg>
                </div>
                <div class="step-content">
                  <div class="step-badge">
                    <span class="step-badge-label">STEP</span>
                    <span class="step-badge-num">02</span>
                  </div>
                  <p class="step-desc">두 번째 단계에서는 <span class="step-highlight">주요 실행 내용을 다룹니다.</span> 실제 진행 과정이나 포인트를 중심으로 설명하면 이해가 쉬워집니다.</p>
                </div>
              </div>
            </li>

            <!-- Down arrow -->
            <div class="step-arrow-wrap">
              <svg viewBox="0 0 32 38" xmlns="http://www.w3.org/2000/svg" fill="none">
                <path d="M16 2 L16 30 M6 22 L16 34 L26 22" stroke="#555555" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <!-- STEP 03 -->
            <li>
              <div class="step-row">
                <!-- Checklist icon -->
                <div class="step-icon-circle">
                  <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none">
                    <rect x="14" y="10" width="32" height="40" rx="4" stroke="white" stroke-width="3"/>
                    <line x1="20" y1="22" x2="40" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="20" y1="30" x2="40" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="20" y1="38" x2="34" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M33 33 L36 38 L42 28" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="step-content">
                  <div class="step-badge">
                    <span class="step-badge-label">STEP</span>
                    <span class="step-badge-num">03</span>
                  </div>
                  <p class="step-desc">마지막 단계에서는 <span class="step-highlight">결과 정리 또는 마무리 내용을 작성합니</span>다. 결과나 효과를 간단히 정리하며 흐름을 마무리합니다.</p>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
