<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>02 — 이미지 그리드 (Image Grid)</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="cal-wrap">
      <div class="cal-header">APRIL NEWSLETTER</div>
      <div class="cal-rings">
        <div class="cal-ring"></div>
        <div class="cal-ring"></div>
      </div>
      <div class="cal-board">

        <!-- 번호 + 제목 -->
        <div class="title-group">
          <div class="slide-num-badge">01</div>
          <h1 class="page-title">이번 달 핵심 업데이트</h1>
        </div>

        <!-- 2열 이미지 그리드 -->
        <div class="img-grid-2col">
          <div class="img-grid-item">
            <div class="img-placeholder">
              <span class="img-placeholder-label">이미지</span>
            </div>
            <p class="img-category">신규 프로젝트 런칭</p>
            <p class="img-caption">매출관리 프로그램<br>'매출이' 앱스토어 등록</p>
          </div>
          <div class="img-grid-item">
            <div class="img-placeholder" style="background: linear-gradient(135deg, #d4e8c8 0%, #7ab87a 100%);">
              <span class="img-placeholder-label">이미지</span>
            </div>
            <p class="img-category">주요 성과</p>
            <p class="img-caption">전체 판매량<br>+25%, 1위 달성</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
