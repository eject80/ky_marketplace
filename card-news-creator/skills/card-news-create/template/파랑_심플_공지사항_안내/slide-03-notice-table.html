<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>03 — 공지 표 (Notice Table)</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="cal-wrap">
      <div class="cal-header">APRIL NEWSLETTER</div>
      <div class="cal-rings">
        <div class="cal-ring"></div>
        <div class="cal-ring"></div>
      </div>
      <div class="cal-board">

        <!-- 번호 + 제목 -->
        <div class="title-group">
          <div class="slide-num-badge">02</div>
          <h1 class="page-title" style="font-size:88px;">꼭 확인해주세요!</h1>
        </div>

        <!-- 공지 항목들 -->
        <div class="notice-list">
          <div class="notice-item">
            <div class="notice-label">인사/조직<br>변경</div>
            <div class="notice-divider-v"></div>
            <div class="notice-content">
              김미리 대리 &gt;&gt; 김미리 과장<br>
              유미리 사원(영업1팀) &gt;&gt; 영업2팀
            </div>
          </div>
          <div class="notice-item">
            <div class="notice-label">복지<br>제도</div>
            <div class="notice-divider-v"></div>
            <div class="notice-content">
              도서구매비 지원 10% 추가지원<br>
              연차 2일 추가 지원
            </div>
          </div>
          <div class="notice-item">
            <div class="notice-label">일정<br>안내</div>
            <div class="notice-divider-v"></div>
            <div class="notice-content">
              4.16 (목) 사내 정기 교육
            </div>
          </div>
        </div>

        <!-- 장식: 새 + 우체통 SVG -->
        <div class="deco-bird">
          <svg width="100" height="130" viewBox="0 0 100 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- 우체통 기둥 -->
            <rect x="44" y="80" width="12" height="50" rx="4" fill="#c44"/>
            <!-- 우체통 몸통 -->
            <rect x="18" y="40" width="64" height="44" rx="10" fill="#d44"/>
            <!-- 우체통 상단 반원 -->
            <ellipse cx="50" cy="40" rx="32" ry="14" fill="#c44"/>
            <!-- 슬롯 -->
            <rect x="30" y="58" width="40" height="6" rx="3" fill="#a33"/>
            <!-- 새 (파랑) -->
            <ellipse cx="62" cy="28" rx="14" ry="10" fill="#2c76f0"/>
            <ellipse cx="74" cy="26" rx="8" ry="6" fill="#2c76f0"/>
            <!-- 날개 -->
            <path d="M50 24 Q44 16 38 22 Q44 26 50 24Z" fill="#1a5bc8"/>
            <!-- 눈 -->
            <circle cx="76" cy="24" r="2" fill="#fff"/>
            <!-- 부리 -->
            <polygon points="82,26 88,27 82,29" fill="#f8c300"/>
          </svg>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
