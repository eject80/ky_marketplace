<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>04 — 이달의 미리인 (Profile)</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="cal-wrap">
      <div class="cal-header">APRIL NEWSLETTER</div>
      <div class="cal-rings">
        <div class="cal-ring"></div>
        <div class="cal-ring"></div>
      </div>
      <div class="cal-board">

        <!-- 번호 + 제목 -->
        <div class="title-group">
          <div class="slide-num-badge">03</div>
          <h1 class="page-title">이달의 미리인</h1>
        </div>

        <!-- 프로필 -->
        <div class="profile-section">
          <div class="profile-bg-deco">
            <!-- 장식: 점 패턴 -->
            <div class="deco-dots-left">
              <div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div>
              <div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div>
              <div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div>
              <div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div><div class="deco-dot-sm"></div>
            </div>
            <!-- 장식: 파랑 원 -->
            <div class="deco-circle-right"></div>
            <div class="deco-circle-small"></div>
            <!-- 장식: 지그재그 -->
            <div class="deco-zap">≋</div>

            <!-- 프로필 원형 이미지 -->
            <div class="profile-circle">
              <span class="profile-circle-inner">사진</span>
            </div>
          </div>

          <!-- 리본 -->
          <div class="profile-ribbon-wrap">
            <div class="profile-ribbon">영업팀 김미리 대리</div>
          </div>
        </div>

        <!-- 설명 -->
        <p class="profile-desc">
          탁월한 고객 관리와 적극적인 영업활동으로 이번 달<br>
          최고 실적을 달성하여 팀 성과에 크게 기여했습니다.
        </p>

        <!-- 하단 주석 -->
        <p class="profile-note">*페이지 내 인물 사진은 실제이미지가 아닙니다.</p>

      </div>
    </div>
  </div>
</body>
</html>
