<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>목차</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="page-stack">
      <div class="page-stack-layer page-stack-layer--1"></div>
      <div class="page-stack-layer page-stack-layer--2"></div>
    </div>

    <div class="main-card">
      <div class="bookmark-tab">
        <div class="bookmark-blue"></div>
        <div class="bookmark-gray"></div>
      </div>

      <!-- TOC Header -->
      <div class="toc-header-row">
        <span class="toc-title">목차</span>
        <span class="toc-desc">
          메시지는 짧고 간결할수록 효과적으로 전달돼요.<br>
          2-3줄로 작성하면 더 쉽게 읽을 수 있어요.
        </span>
      </div>

      <hr class="divider-line">

      <ul class="toc-list">
        <li class="toc-item">
          <div class="toc-num-box"><span class="toc-num">01</span></div>
          <span class="toc-item-title">주제 소개</span>
          <span class="toc-item-desc">핵심 문장을 입력해주세요.</span>
        </li>
        <li class="toc-item">
          <div class="toc-num-box"><span class="toc-num">02</span></div>
          <span class="toc-item-title">표 정리</span>
          <span class="toc-item-desc">핵심 문장을 입력해주세요.</span>
        </li>
        <li class="toc-item">
          <div class="toc-num-box"><span class="toc-num">03</span></div>
          <span class="toc-item-title">텍스트 정리</span>
          <span class="toc-item-desc">핵심 문장을 입력해주세요.</span>
        </li>
        <li class="toc-item">
          <div class="toc-num-box"><span class="toc-num">04</span></div>
          <span class="toc-item-title">사진 활용</span>
          <span class="toc-item-desc">핵심 문장을 입력해주세요.</span>
        </li>
        <li class="toc-item">
          <div class="toc-num-box"><span class="toc-num">05</span></div>
          <span class="toc-item-title">순서 과정</span>
          <span class="toc-item-desc">핵심 문장을 입력해주세요.</span>
        </li>
        <li class="toc-item">
          <div class="toc-num-box"><span class="toc-num">06</span></div>
          <span class="toc-item-title">내용 비교</span>
          <span class="toc-item-desc">핵심 문장을 입력해주세요.</span>
        </li>
      </ul>

      <div class="char-note"></div>
    </div>
  </div>
