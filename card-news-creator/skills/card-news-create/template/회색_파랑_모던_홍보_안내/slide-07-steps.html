<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>순서 과정 페이지</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="page-stack">
      <div class="page-stack-layer page-stack-layer--1"></div>
      <div class="page-stack-layer page-stack-layer--2"></div>
    </div>

    <div class="main-card">
      <div class="bookmark-tab">
        <div class="bookmark-blue"></div>
        <div class="bookmark-gray"></div>
      </div>

      <!-- Page title -->
      <div class="page-title-row">
        <span class="page-title"><span class="t-blue">순서 과정</span> <span style="color:#1a1a1a;">페이지</span></span>
      </div>
      <hr class="divider-line">

      <!-- Steps -->
      <div class="steps-wrap">
        <div class="steps-row">
          <!-- Step 1 -->
          <div class="step-card">
            <div class="step-header">키워드</div>
            <div class="step-body">
              <div class="step-icon-area">
                <!-- Handshake icon -->
                <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" width="88" height="88">
                  <path d="M12 52 C20 40 32 36 44 40 L56 44 L72 36" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  <path d="M12 52 L28 60 L44 56 L60 52 L72 60" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  <path d="M44 40 L56 32 L68 40 L56 52 L44 40Z" stroke="#888" stroke-width="3" fill="none" stroke-linejoin="round"/>
                  <path d="M28 60 L32 70 M44 56 L48 68" stroke="#888" stroke-width="3" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="step-desc">이곳에 관련 내용을 텍스트로 간략하게 입력해주세요.</div>
            </div>
          </div>

          <!-- Arrow -->
          <div class="step-arrow">&#8594;</div>

          <!-- Step 2 -->
          <div class="step-card">
            <div class="step-header">키워드</div>
            <div class="step-body">
              <div class="step-icon-area">
                <!-- Celebration icon -->
                <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" width="88" height="88">
                  <path d="M44 60 L44 48 L38 42 M44 48 L50 42" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- Stars -->
                  <path d="M28 30 L30 24 L32 30 L38 30 L33 34 L35 40 L30 36 L25 40 L27 34 L22 30 Z" stroke="#888" stroke-width="2" fill="none" stroke-linejoin="round"/>
                  <path d="M55 26 L56.5 22 L58 26 L62 26 L59 28.5 L60 32.5 L56.5 30 L53 32.5 L54 28.5 L51 26 Z" stroke="#888" stroke-width="2" fill="none" stroke-linejoin="round"/>
                  <!-- Sparkles -->
                  <circle cx="38" cy="22" r="3" fill="#f0a030" opacity="0.6"/>
                  <circle cx="60" cy="40" r="2.5" fill="#3d7fc4" opacity="0.6"/>
                  <circle cx="30" cy="48" r="2" fill="#f0a030" opacity="0.5"/>
                </svg>
              </div>
              <div class="step-desc">이곳에 관련 내용을 텍스트로 간략하게 입력해주세요.</div>
            </div>
          </div>

          <!-- Arrow -->
          <div class="step-arrow">&#8594;</div>

          <!-- Step 3 -->
          <div class="step-card">
            <div class="step-header">키워드</div>
            <div class="step-body">
              <div class="step-icon-area">
                <!-- Steps/stairs climbing icon -->
                <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" width="88" height="88">
                  <!-- Stairs -->
                  <path d="M16 68 L36 68 L36 52 L54 52 L54 36 L72 36 L72 28" stroke="#888" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  <!-- Person climbing -->
                  <circle cx="62" cy="22" r="7" stroke="#555" stroke-width="3" fill="none"/>
                  <path d="M62 29 L62 48 L54 58 M62 36 L70 44" stroke="#555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <div class="step-desc">이곳에 관련 내용을 텍스트로 간략하게 입력해주세요.</div>
            </div>
          </div>
        </div>

        <!-- Footer description -->
        <p class="steps-footer">
          아이콘을 따라 각 단계의 진행 과정을 확인해 보세요.<br>
          순서에 맞춰 핵심 내용을 간단하게 정리했습니다.<br>
          단계별 설명을 참고해 흐름을 이해할 수 있습니다.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
