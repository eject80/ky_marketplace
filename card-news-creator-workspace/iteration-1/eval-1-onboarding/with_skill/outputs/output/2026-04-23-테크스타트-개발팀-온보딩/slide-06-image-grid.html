<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>06 — 협업 도구 사용법</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="card">
      <!-- Top bar -->
      <div class="top-bar">
        <span class="top-bar-company">협업 도구</span>
      </div>

      <!-- Body -->
      <div class="card-body">
        <p class="section-pre">테크스타트</p>
        <h1 class="page-title">협업 도구 사용법</h1>
        <p class="intro-text">팀과 효율적으로 협업하기 위해 아래 도구들을 사용합니다.<br>각 도구의 목적과 사용 방법을 숙지해 주세요.</p>

        <!-- Main tool: Slack -->
        <div class="main-img" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;">
          <span style="font-size:28px;font-weight:700;letter-spacing:1px;">SLACK</span>
          <span class="main-img-label" style="position:static;margin:0;">실시간 팀 커뮤니케이션 — #dev-team, #dev-daily, #general 채널 참여</span>
        </div>

        <!-- 2x2 sub grid -->
        <div class="sub-grid">
          <div class="sub-img-item">
            <div class="sub-img sub-img--1" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;">
              <span style="font-size:20px;font-weight:700;">JIRA</span>
              <span class="sub-img-label" style="position:static;font-size:12px;text-align:center;">이슈 트래킹 및<br>스프린트 관리</span>
            </div>
          </div>
          <div class="sub-img-item">
            <div class="sub-img sub-img--2" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;">
              <span style="font-size:20px;font-weight:700;">GITHUB</span>
              <span class="sub-img-label" style="position:static;font-size:12px;text-align:center;">소스 관리 및<br>코드 리뷰 (PR)</span>
            </div>
          </div>
          <div class="sub-img-item">
            <div class="sub-img sub-img--3" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;">
              <span style="font-size:20px;font-weight:700;">NOTION</span>
              <span class="sub-img-label" style="position:static;font-size:12px;text-align:center;">팀 문서화 및<br>지식 관리</span>
            </div>
          </div>
          <div class="sub-img-item">
            <div class="sub-img sub-img--4" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;">
              <span style="font-size:20px;font-weight:700;">GOOGLE MEET</span>
              <span class="sub-img-label" style="position:static;font-size:12px;text-align:center;">화상 회의 및<br>스크럼 진행</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <div class="footer-logo">TECHSTART</div>
        <div class="footer-date">2026년 4월 | 개발팀</div>
      </div>
    </div>
  </div>
</body>
</html>
