<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>03 — 팀 문화</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="card">
      <!-- Top bar -->
      <div class="top-bar">
        <span class="top-bar-company">개발팀 문화</span>
      </div>

      <!-- Body -->
      <div class="card-body">
        <p class="section-pre">테크스타트</p>
        <h1 class="page-title">팀 문화</h1>

        <p class="desc-text">우리 개발팀은 자율성과 책임감을 바탕으로, 기술 성장과<br>팀워크를 함께 중시하는 문화를 만들어갑니다.</p>

        <div class="mv-row">
          <div class="mv-box">
            <span class="mv-label">우리의 방식</span>
            <p class="mv-text">코드 리뷰를 통해 서로 성장하고,<br>심리적 안전감 속에서 자유롭게 의견을 냅니다.</p>
          </div>
          <div class="mv-box">
            <span class="mv-label">우리의 약속</span>
            <p class="mv-text">데일리 스크럼으로 소통하고, 문서화로<br>팀 지식을 공유하며 함께 성장합니다.</p>
          </div>
        </div>

        <div class="core-section">
          <div class="core-label-wrap">
            <span class="core-label">핵심 가치</span>
          </div>
          <div class="core-pills">
            <div class="core-pill">자율과 책임</div>
            <div class="core-pill">기술적 탁월함</div>
            <div class="core-pill">투명한 소통</div>
            <div class="core-pill">지속적 성장</div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <div class="footer-logo">TECHSTART</div>
        <div class="footer-date">2026년 4월 | 개발팀</div>
      </div>
    </div>
  </div>
</body>
</html>
