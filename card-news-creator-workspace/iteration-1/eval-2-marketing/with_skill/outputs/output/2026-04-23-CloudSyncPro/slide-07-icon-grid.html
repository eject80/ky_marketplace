<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>CloudSync Pro — 요금제</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="board">
      <div class="shadow-card shadow-card--2"></div>
      <div class="shadow-card shadow-card--1"></div>

      <div class="clip-wrapper">
        <svg viewBox="0 0 50 96" width="50" height="96" xmlns="http://www.w3.org/2000/svg">
          <path d="M9,72 L9,28 C9,8 41,8 41,28 L41,72" fill="none" stroke="#cf1f1f" stroke-width="9" stroke-linecap="round"/>
          <path d="M18,72 L18,36 C18,24 32,24 32,36 L32,72" fill="none" stroke="#cf1f1f" stroke-width="9" stroke-linecap="round"/>
          <rect x="5" y="68" width="40" height="24" rx="5" fill="#cf1f1f"/>
        </svg>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-header-label">CARDNEWS</span>
        </div>
        <div class="card-body">
          <div class="script-row">
            <span class="script-text">CloudSync Pro Launch</span>
          </div>
          <h1 class="slide-h1">요금제 안내</h1>
          <hr class="divider-red">
          <div class="icon-grid">
            <!-- 무료 플랜 — 별 아이콘 -->
            <div class="icon-col">
              <svg class="icon-bubble" viewBox="0 0 130 148" xmlns="http://www.w3.org/2000/svg">
                <circle cx="65" cy="58" r="54" fill="#cf1f1f"/>
                <polygon points="46,106 65,134 84,106" fill="#cf1f1f"/>
                <!-- 별 아이콘 -->
                <polygon points="65,28 71,46 90,46 75,57 81,75 65,64 49,75 55,57 40,46 59,46" fill="white"/>
              </svg>
              <div class="icon-keyword">무료</div>
              <div class="icon-desc">기본 기능 제공<br>개인 사용자에게<br>최적의 시작점</div>
            </div>
            <!-- 스탠다드 플랜 — 문서 아이콘 -->
            <div class="icon-col">
              <svg class="icon-bubble" viewBox="0 0 130 148" xmlns="http://www.w3.org/2000/svg">
                <circle cx="65" cy="58" r="54" fill="#cf1f1f"/>
                <polygon points="46,106 65,134 84,106" fill="#cf1f1f"/>
                <!-- 왕관 아이콘 -->
                <polyline points="38,72 46,44 65,62 84,44 92,72" fill="white" stroke="none"/>
                <rect x="36" y="70" width="58" height="10" rx="3" fill="white"/>
              </svg>
              <div class="icon-keyword">스탠다드</div>
              <div class="icon-desc">월 9,900원<br>고급 기능 포함<br>소규모 팀 추천</div>
            </div>
            <!-- 프로 플랜 — 로켓 아이콘 -->
            <div class="icon-col">
              <svg class="icon-bubble" viewBox="0 0 130 148" xmlns="http://www.w3.org/2000/svg">
                <circle cx="65" cy="58" r="54" fill="#cf1f1f"/>
                <polygon points="46,106 65,134 84,106" fill="#cf1f1f"/>
                <!-- 다이아몬드 아이콘 -->
                <polygon points="65,28 90,50 65,88 40,50" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
                <line x1="40" y1="50" x2="90" y2="50" stroke="white" stroke-width="3.5"/>
                <line x1="52" y1="50" x2="65" y2="28" stroke="white" stroke-width="2.5"/>
                <line x1="78" y1="50" x2="65" y2="28" stroke="white" stroke-width="2.5"/>
              </svg>
              <div class="icon-keyword">프로</div>
              <div class="icon-desc">월 29,900원<br>무제한 전체 기능<br>대규모 팀 최적화</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
