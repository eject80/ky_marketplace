<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>CloudSync Pro — 핵심 기능</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="canvas">
    <div class="board">
      <div class="shadow-card shadow-card--2"></div>
      <div class="shadow-card shadow-card--1"></div>

      <div class="clip-wrapper">
        <svg viewBox="0 0 50 96" width="50" height="96" xmlns="http://www.w3.org/2000/svg">
          <path d="M9,72 L9,28 C9,8 41,8 41,28 L41,72" fill="none" stroke="#cf1f1f" stroke-width="9" stroke-linecap="round"/>
          <path d="M18,72 L18,36 C18,24 32,24 32,36 L32,72" fill="none" stroke="#cf1f1f" stroke-width="9" stroke-linecap="round"/>
          <rect x="5" y="68" width="40" height="24" rx="5" fill="#cf1f1f"/>
        </svg>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-header-label">CARDNEWS</span>
        </div>
        <div class="card-body">
          <div class="script-row">
            <span class="script-text">CloudSync Pro Launch</span>
          </div>
          <h1 class="slide-h1">핵심 기능 3가지</h1>
          <hr class="divider-red">
          <ul class="points-list">
            <li class="point-item">
              <svg class="point-bubble" viewBox="0 0 72 82" xmlns="http://www.w3.org/2000/svg">
                <circle cx="36" cy="32" r="30" fill="#cf1f1f"/>
                <polygon points="24,58 36,76 48,58" fill="#cf1f1f"/>
                <text x="36" y="41" text-anchor="middle" font-family="Noto Sans KR, Pretendard, sans-serif" font-weight="700" font-size="26" fill="white">01</text>
              </svg>
              <div class="point-content">
                <div class="point-keyword">실시간 동기화</div>
                <div class="point-desc">모든 기기에서 파일이 즉시 동기화됩니다. 저장하는 순간 어디서든 최신 버전으로 접근하세요.</div>
              </div>
            </li>
            <li class="point-item">
              <svg class="point-bubble" viewBox="0 0 72 82" xmlns="http://www.w3.org/2000/svg">
                <circle cx="36" cy="32" r="30" fill="#cf1f1f"/>
                <polygon points="24,58 36,76 48,58" fill="#cf1f1f"/>
                <text x="36" y="41" text-anchor="middle" font-family="Noto Sans KR, Pretendard, sans-serif" font-weight="700" font-size="26" fill="white">02</text>
              </svg>
              <div class="point-content">
                <div class="point-keyword">무제한 저장</div>
                <div class="point-desc">용량 걱정 없이 마음껏 저장하세요. 사진, 영상, 문서 등 모든 파일 형식을 지원합니다.</div>
              </div>
            </li>
            <li class="point-item">
              <svg class="point-bubble" viewBox="0 0 72 82" xmlns="http://www.w3.org/2000/svg">
                <circle cx="36" cy="32" r="30" fill="#cf1f1f"/>
                <polygon points="24,58 36,76 48,58" fill="#cf1f1f"/>
                <text x="36" y="41" text-anchor="middle" font-family="Noto Sans KR, Pretendard, sans-serif" font-weight="700" font-size="26" fill="white">03</text>
              </svg>
              <div class="point-content">
                <div class="point-keyword">팀 협업</div>
                <div class="point-desc">팀원과 폴더를 공유하고 실시간으로 함께 작업하세요. 권한 관리와 변경 이력도 제공합니다.</div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
